# Example batch-experiment matrix. Each entry is a config overlay on top of
# config.yaml's defaults. This file isn't executed automatically yet -- it
# documents the intended format for a future batch-sweep runner, and is a
# convenient place to keep known-good combos plus combos you're planning to
# promote from stub to real next.

experiments:
  - name: inference_pytorch_resnet18_cifar10_tcp
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP

  - name: inference_pytorch_resnet18_cifar10_tls
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TLS

  - name: fl_flower_resnet18_cifar10
    paradigm: federated_learning
    fl_framework: Flower
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 2
    num_rounds: 3

  - name: distributed_ddp_resnet18_cifar10
    paradigm: distributed_training
    distributed_framework: DistributedDataParallel
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 2
    num_rounds: 2

  # Implemented, but hardware-gated -- needs an actual NVIDIA GPU (Jetson)
  # with TensorRT + pycuda installed to run; validates and lists fine
  # without them, it just can't build/run an engine.
  - name: inference_tensorrt_resnet18_jetson
    paradigm: inference
    framework: TensorRT
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: jetson_agx_orin

  # Implemented and verified end-to-end -- OpenVINO's CPU plugin runs on
  # any x86/ARM machine, no special hardware required.
  - name: inference_openvino_resnet18_windows
    paradigm: inference
    framework: OpenVINO
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: windows

  # Implemented; conversion needs a Python version `tensorflow` has a wheel
  # for (via litert-torch), inference itself is TensorFlow-independent
  # (ai-edge-litert). Validates and lists fine regardless.
  - name: inference_tflite_resnet18_linux
    paradigm: inference
    framework: TensorFlow Lite
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: ubuntu

  # Implemented and verified end-to-end -- pure Python/C++ wheel, no
  # special hardware required.
  - name: inference_onnxruntime_resnet18_windows
    paradigm: inference
    framework: ONNX Runtime
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: windows

  # Implemented and verified end-to-end (model prep/conversion + desktop
  # inference); real on-device NNAPI/CoreML execution needs a native
  # Android/iOS app, out of scope -- device here is the intended target,
  # not where this process literally runs.
  - name: inference_onnxruntimemobile_resnet18_iphone
    paradigm: inference
    framework: ONNX Runtime Mobile
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: iphone
