# Example batch-experiment matrix. Each entry is a config overlay on top of
# config.yaml's defaults. This file isn't executed automatically yet -- it
# documents the intended format for a future batch-sweep runner, and is a
# convenient place to keep known-good combos plus combos you're planning to
# promote from stub to real next.

experiments:
  - name: inference_pytorch_resnet18_cifar10_tcp
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP

  - name: inference_pytorch_resnet18_cifar10_tls
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TLS

  # HTTP transport: plain http.server/http.client, standard library only.
  # Verified end-to-end including a real client/server roundtrip -- see
  # transport/http.py's docstring for how its queue-based bridge adapts
  # this project's synchronous send()/recv() interface onto HTTP's
  # request/response model.
  - name: inference_pytorch_resnet18_synthetic_http
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: Synthetic
    transport: HTTP

  # gRPC transport: raw-bytes unary-unary calls via grpc's low-level API
  # (identity serializers, no .proto schema or generated stub code) --
  # see transport/grpc.py's docstring for how this avoids needing a
  # protobuf schema, and how its queue-based bridge adapts this project's
  # synchronous send()/recv() interface onto gRPC's single-call
  # request/response model, the same shape transport/http.py already uses
  # for HTTP. Verified end-to-end with a real two-process client/server
  # run (real ResNet18/CIFAR10), correct ground truth ("transport": "gRPC").
  - name: inference_pytorch_resnet18_cifar10_grpc
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: gRPC

  # Verified directly: load/predict/serialize/deserialize, plus confirmed
  # MobileNetV2 also runs correctly through the OpenVINO adapter
  # unchanged -- these unlock real use across every already-implemented
  # framework's generic PyTorch-conversion path, not just PyTorch.
  - name: inference_pytorch_mobilenetv2_cifar10
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: MobileNetV2
    application: Image Classification
    dataset: CIFAR10
    transport: TCP

  - name: inference_pytorch_resnet50_cifar10
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet50
    application: Image Classification
    dataset: CIFAR10
    transport: TCP

  # First Transformer-family architecture. Verified end-to-end through
  # PyTorch; deliberately not paired with OpenVINO here -- conversion
  # fails on ViT specifically (Dropout trace-consistency false positive),
  # see architectures/vit.py's docstring.
  - name: inference_pytorch_vit_cifar10
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: ViT
    application: Image Classification
    dataset: CIFAR10
    transport: TCP

  # First NLP vertical slice. input_ids/token_type_ids/attention_mask are
  # stacked into one (3, 32) tensor to fit this project's one-tensor wire
  # protocol -- see architectures/bert.py's docstring. IMDB is downloaded
  # via the standard library, not HuggingFace's `datasets` pip package
  # (name collision with this project's own datasets/ package -- see
  # datasets/imdb.py's docstring). Verified end-to-end including a real
  # client/server roundtrip.
  - name: inference_pytorch_bert_imdb
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: BERT
    application: Sentiment Analysis
    dataset: IMDB
    transport: TCP

  # Second dataset for the same Sentiment Analysis pipeline, no changes
  # needed to BERT or Sentiment Analysis. Real GLUE-benchmark SST-2
  # release, downloaded/parsed via the standard library -- see
  # datasets/sst2.py's docstring for how test.tsv (no labels) was ruled
  # out in favor of dev.tsv. Verified end-to-end including a real
  # client/server roundtrip.
  - name: inference_pytorch_bert_sst2
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: BERT
    application: Sentiment Analysis
    dataset: SST2
    transport: TCP

  # Reuses the BERT/Sentiment Analysis/IMDB pipeline unchanged.
  # DistilBERT's forward() takes only input_ids/attention_mask, no
  # token_type_ids -- see architectures/distilbert.py's docstring.
  - name: inference_pytorch_distilbert_imdb
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: DistilBERT
    application: Sentiment Analysis
    dataset: IMDB
    transport: TCP

  # New architecture beyond the original 13, same gap-fill precedent as
  # Autoencoder/YOLOv8-Seg. Whisper's real inference is autoregressive
  # generation, run inside _WhisperWrapper.forward() -- see
  # architectures/whisper.py's docstring. speech_framework: Whisper is
  # validated but doesn't change behavior (architectures/whisper.py's
  # default already IS the real implementation) -- see
  # speech_frameworks/whisper_adapter.py. Verified end-to-end including a
  # real client/server roundtrip.
  - name: inference_pytorch_whisper_synthetic
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: Whisper
    application: Speech Recognition
    dataset: Synthetic
    transport: TCP

  # Same Whisper/Speech Recognition/Synthetic combo, but speech_framework:
  # SpeechBrain genuinely changes behavior here: architectures/whisper.py
  # dispatches to speech_frameworks/speechbrain_adapter.py's
  # build_whisper(), a real Conv1d/LSTM acoustic model built from
  # SpeechBrain's layer primitives directly (its higher-level CRDNN lobe
  # hard-fails here -- see that module's docstring for the k2_fsa lazy-
  # import bug found and routed around). Verified end-to-end including a
  # real client/server roundtrip.
  - name: inference_pytorch_whisper_synthetic_speechbrain
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: Whisper
    application: Speech Recognition
    dataset: Synthetic
    transport: TCP
    speech_framework: SpeechBrain

  # Same Whisper/Speech Recognition/Synthetic combo, but speech_framework:
  # ESPnet -- a third dispatch target. Uses ESPnet's real
  # espnet2.asr.encoder.transformer_encoder.TransformerEncoder directly
  # (genuine self-attention transformer layers), not the full
  # ESPnetASRModel/task-recipe machinery -- see
  # speech_frameworks/espnet_adapter.py's docstring. Needed a real C/C++
  # compiler to install (ESPnet's transitive sentencepiece dependency
  # builds from source) -- same prerequisite as llm_framework: llama.cpp
  # below. Verified end-to-end through architectures/whisper.py's real
  # dispatch.
  - name: inference_pytorch_whisper_synthetic_espnet
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: Whisper
    application: Speech Recognition
    dataset: Synthetic
    transport: TCP
    speech_framework: ESPnet

  # Last application/architecture gap, and what llm_framework was added
  # for. Same autoregressive-generation-inside-forward() pattern as
  # Whisper -- see architectures/gpt2.py's docstring. Unlike Image
  # Generation/Speech Recognition, real IMDB text is a meaningful
  # generation prompt, so it's reused directly rather than synthesized.
  # llm_framework: HuggingFace Transformers is validated but doesn't
  # change behavior (architectures/gpt2.py's default already IS the real
  # implementation) -- see llm_frameworks/huggingface_transformers_adapter.py.
  # Verified end-to-end including a real client/server roundtrip with
  # real IMDB prompts.
  - name: inference_pytorch_gpt2_imdb
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: GPT-2
    application: Text Generation
    dataset: IMDB
    transport: TCP

  # Same GPT-2/Text Generation/IMDB combo, but llm_framework: FastChat
  # genuinely changes behavior here (unlike HuggingFace Transformers
  # above): architectures/gpt2.py dispatches to
  # llm_frameworks/fastchat_adapter.py's build_gpt2(), which loads the
  # model back through FastChat's own load_model() instead of keeping it
  # in-process. See that module's docstring for the conversation-template
  # dead end (its default template blows past this project's context
  # window; the "raw" template works but would need config threaded into
  # Application.preprocess()). Verified end-to-end including a real
  # client/server roundtrip with real IMDB prompts.
  - name: inference_pytorch_gpt2_imdb_fastchat
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: GPT-2
    application: Text Generation
    dataset: IMDB
    transport: TCP
    llm_framework: FastChat

  # A different shape of GPT-2 dispatch: llama.cpp is a genuinely separate
  # C++ engine, not a transformers.GPT2LMHeadModel, so labeling it "the
  # GPT-2 architecture" the way FastChat's dispatch honestly can would be
  # wrong. The wire protocol stays GPT-2's own; _LlamaCppWrapper
  # translates at the model boundary instead (decode wire tokens to text
  # via GPT-2's tokenizer -> real llama.cpp inference -> re-encode via
  # GPT-2's tokenizer). Needed a real C/C++ compiler to install at all --
  # see README.md's "C/C++ compiler prerequisite" section and
  # llm_frameworks/llamacpp_adapter.py's docstring. Verified end-to-end
  # with a real, tiny trained test model (stories260K.gguf) including a
  # real client/server roundtrip -- generated continuations are genuinely
  # coherent, unlike this project's usual random-init architectures.
  - name: inference_pytorch_gpt2_imdb_llamacpp
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: GPT-2
    application: Text Generation
    dataset: IMDB
    transport: TCP
    llm_framework: llama.cpp

  # First RNN-family vertical slice. UCI HAR's real archive is a nested
  # zip with 9 "Inertial Signals" channel files, 128-timestep windows --
  # confirmed by inspection, see datasets/uci_har.py's docstring.
  # families/rnn's shared transpose helper handles the (channels,
  # timesteps) -> (timesteps, channels) conversion both LSTM and GRU
  # reuse unchanged. Verified end-to-end for both including a real
  # client/server roundtrip (LSTM).
  - name: inference_pytorch_lstm_ucihar
    paradigm: inference
    framework: PyTorch
    family: RNN
    architecture: LSTM
    application: Activity Recognition
    dataset: UCI HAR
    transport: TCP

  - name: inference_pytorch_gru_ucihar
    paradigm: inference
    framework: PyTorch
    family: RNN
    architecture: GRU
    application: Activity Recognition
    dataset: UCI HAR
    transport: TCP

  # First Diffusion-family slice. "Inference" is a T=20-step reverse-
  # diffusion loop, but it lives entirely inside the model's forward() --
  # invisible to the framework adapter, one predict() call in/out over the
  # same wire protocol as everything else. See architectures/ddpm.py's
  # docstring. Verified no NaN/Inf across the full reverse process, plus a
  # real client/server roundtrip.
  - name: inference_pytorch_ddpm_synthetic
    paradigm: inference
    framework: PyTorch
    family: Diffusion
    architecture: DDPM
    application: Image Generation
    dataset: Synthetic
    transport: TCP

  - name: fl_flower_resnet18_cifar10
    paradigm: federated_learning
    fl_framework: Flower
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 2
    num_rounds: 3

  # Same Flower/ResNet18 combo, but dataset: Synthetic -- genuinely
  # different traffic now, not just a label. core/training_data.py's
  # build_classification_dataset() replaced every FL/distributed
  # adapter's hardcoded torchvision.datasets.CIFAR10 loader with the same
  # DATASETS/APPLICATIONS registry paradigm=inference uses, so this
  # actually trains on Synthetic data (fast, no download) instead of
  # silently training on CIFAR10 while claiming Synthetic in ground
  # truth, which is what every FL/distributed adapter did before this
  # entry existed. Verified end-to-end including a real client/server
  # roundtrip, ground_truth.json correctly recording "dataset":
  # "Synthetic". See core/config.py's FL_DISTRIBUTED_COMPATIBLE_ARCHITECTURES
  # and core/training_data.py for exactly which architecture/application/
  # dataset combinations this supports and why (CIFAR10 or Synthetic for
  # Image Classification -- both real 10-label classification data,
  # unlike e.g. ImageNet's 1000 classes).
  - name: fl_flower_resnet18_synthetic
    paradigm: federated_learning
    fl_framework: Flower
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: Synthetic
    transport: TCP
    num_clients: 1
    num_rounds: 1

  # Real torch.distributed gloo/TCP rendezvous verified working in
  # isolation on this machine; the client/server pair hangs indefinitely
  # right after connecting, inside FedLab's own post-connect handshake --
  # see frameworks/fedlab_adapter.py's docstring for exactly what was
  # isolated and what remains unresolved. Its data loading was updated to
  # the same registry-based loader Flower/DDP/FairScale now use
  # (core/training_data.py) for consistency, but that change couldn't be
  # verified end-to-end here either, for the same pre-existing hang.
  - name: fl_fedlab_resnet18_cifar10
    paradigm: federated_learning
    fl_framework: FedLab
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 1
    num_rounds: 1

  # Two separate real problems, both confirmed directly, not just
  # untested: import nvflare fails outright on Windows (needs the
  # POSIX-only `resource` module), and separately, the simulator_run()
  # API this adapter uses runs every client in-process over in-memory
  # queues even on a supported OS -- no real network traffic at all. See
  # fl_frameworks/nvflare_adapter.py's docstring for both. Its generated
  # client script was updated to call core/training_data.py's shared
  # loader instead of duplicating CIFAR10-loading code inline, but
  # whether that script can actually import this project's own modules
  # when NVFlare executes it is unverified here too, for the same
  # pre-existing import failure -- see that module's docstring.
  - name: fl_nvflare_resnet18_cifar10
    paradigm: federated_learning
    fl_framework: NVFlare
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 2
    num_rounds: 1

  - name: distributed_ddp_resnet18_cifar10
    paradigm: distributed_training
    distributed_framework: DistributedDataParallel
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 2
    num_rounds: 2

  # Same DDP/ResNet18 combo, dataset: Synthetic -- see the Flower
  # Synthetic entry above for what changed and why. Verified end-to-end
  # with a real 2-process coordinator+worker run, both ranks completing
  # cleanly, correct ground truth.
  - name: distributed_ddp_resnet18_synthetic
    paradigm: distributed_training
    distributed_framework: DistributedDataParallel
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: Synthetic
    transport: TCP
    num_clients: 2
    num_rounds: 1

  # OSS + ShardedDataParallel over the same gloo/TCP process group as the
  # DDP entry above. Originally only spot-verified via an isolated
  # two-rank synthetic-data script, not through main.py, because
  # CIFAR10's ~170MB train split downloaded too slowly in this
  # environment (~40 min). Switching to dataset: Synthetic here removes
  # that slowness entirely (no download at all) -- this is the first
  # real, full main.py run of this adapter, both ranks completing
  # cleanly, correct ground truth.
  - name: distributed_fairscale_resnet18_synthetic
    paradigm: distributed_training
    distributed_framework: FairScale
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: Synthetic
    transport: TCP
    num_clients: 2
    num_rounds: 1

  # Same FairScale combo against the real CIFAR10 split -- not directly
  # re-verified through main.py here (the Synthetic entry above is what
  # actually got the first full run), but the underlying data loading is
  # identical code (core/training_data.py) to every other CIFAR10 entry
  # in this file that has been verified, so this is expected to work the
  # same way.
  - name: distributed_fairscale_resnet18_cifar10
    paradigm: distributed_training
    distributed_framework: FairScale
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 2
    num_rounds: 2

  # First non-Image-Classification FL/distributed combo -- confirmed
  # BERT/DistilBERT (num_classes=2) and IMDB/SST2 (both yield exactly
  # "negative"/"positive") are classification-shaped in exactly the way
  # ResNet18/CIFAR10 is, so core/training_data.py's
  # build_classification_dataset() needed no new mechanics, just
  # architecture/dataset registry wiring -- see
  # core/config.py's FL_DISTRIBUTED_COMPATIBLE_ARCHITECTURES for the
  # confirmed reasoning (and why Node Classification/GCN does NOT fit the
  # same way). Verified end-to-end with a real Flower client/server
  # roundtrip, ground_truth.json correctly recording "architecture":
  # "BERT", "application": "Sentiment Analysis", "dataset": "IMDB".
  - name: fl_flower_bert_imdb
    paradigm: federated_learning
    fl_framework: Flower
    framework: PyTorch
    family: Transformer
    architecture: BERT
    application: Sentiment Analysis
    dataset: IMDB
    transport: TCP
    num_clients: 1
    num_rounds: 1

  # Second non-Image-Classification FL/distributed combo: LSTM
  # (num_classes=6) + UCI HAR (exactly 6 activity labels), same
  # classification-shaped reasoning as the Flower/BERT entry above.
  # Verified end-to-end with a real DDP coordinator+worker roundtrip,
  # ground_truth.json correctly recording "architecture": "LSTM",
  # "application": "Activity Recognition", "dataset": "UCI HAR".
  - name: distributed_ddp_lstm_ucihar
    paradigm: distributed_training
    distributed_framework: DistributedDataParallel
    framework: PyTorch
    family: RNN
    architecture: LSTM
    application: Activity Recognition
    dataset: UCI HAR
    transport: TCP
    num_clients: 2
    num_rounds: 1

  # Implemented, but hardware-gated -- needs an actual NVIDIA GPU (Jetson)
  # with TensorRT + pycuda installed to run; validates and lists fine
  # without them, it just can't build/run an engine.
  - name: inference_tensorrt_resnet18_jetson
    paradigm: inference
    framework: TensorRT
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: jetson_agx_orin

  # Implemented and verified end-to-end -- OpenVINO's CPU plugin runs on
  # any x86/ARM machine, no special hardware required.
  - name: inference_openvino_resnet18_windows
    paradigm: inference
    framework: OpenVINO
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: windows

  # Implemented; conversion needs a Python version `tensorflow` has a wheel
  # for (via litert-torch), inference itself is TensorFlow-independent
  # (ai-edge-litert). Validates and lists fine regardless.
  - name: inference_tflite_resnet18_linux
    paradigm: inference
    framework: TensorFlow Lite
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: ubuntu

  # Implemented and verified end-to-end -- pure Python/C++ wheel, no
  # special hardware required.
  - name: inference_onnxruntime_resnet18_windows
    paradigm: inference
    framework: ONNX Runtime
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: windows

  # Implemented and verified end-to-end (model prep/conversion + desktop
  # inference); real on-device NNAPI/CoreML execution needs a native
  # Android/iOS app, out of scope -- device here is the intended target,
  # not where this process literally runs.
  - name: inference_onnxruntimemobile_resnet18_iphone
    paradigm: inference
    framework: ONNX Runtime Mobile
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: iphone

  # Implemented and verified end-to-end (trace -> optimize_for_mobile ->
  # save .ptl -> load -> run, all via `torch` -- no extra dependency);
  # real on-device execution needs a native Android/iOS app, out of scope
  # -- device here is the intended target, not where this process runs.
  - name: inference_pytorchmobile_resnet18_android
    paradigm: inference
    framework: PyTorch Mobile
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: samsung_galaxy

  # Written to ExecuTorch's documented export/host-runtime API but NOT
  # execution-verified -- `executorch` has no PyPI wheel for this
  # project's Python version. Validates and lists fine either way; see
  # frameworks/executorch_adapter.py's docstring before relying on it.
  - name: inference_executorch_resnet18_iphone
    paradigm: inference
    framework: ExecuTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: iphone

  # Written to TVM's documented Relay-frontend/graph_executor API but NOT
  # execution-verified -- `apache-tvm` has no prebuilt wheel here and
  # falls back to a from-source CMake build that needs a C/C++ compiler
  # toolchain this machine doesn't have. Validates and lists fine; see
  # frameworks/tvm_adapter.py's docstring before relying on it.
  - name: inference_tvm_resnet18_windows
    paradigm: inference
    framework: TVM
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: windows

  # Conversion verified end-to-end on Windows (coremltools.convert with
  # convert_to="neuralnetwork"); running the converted model was tried and
  # confirmed to fail with coremltools' own real "prediction only
  # supported on macOS" error -- structurally the same as TensorRT
  # needing an NVIDIA GPU. device here is the intended execution target.
  - name: inference_coreml_resnet18_macbook
    paradigm: inference
    framework: CoreML
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: macbook

  # PyTorch's own MPS execution backend, not a converter -- reuses
  # ResNet18 unconverted, just moved onto torch.device("mps"). Verified
  # directly on this Windows machine: torch.backends.mps.is_available()
  # correctly reports False (no Metal backend compiled into non-Apple
  # torch builds), and the adapter raises a clear error at build() time
  # rather than silently falling back to CPU.
  - name: inference_mpsbackend_resnet18_macbook
    paradigm: inference
    framework: MPS Backend
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: macbook

  # First non-ResNet18 vertical slice: YOLOv8 loaded via Ultralytics
  # itself, returned as a plain nn.Module so the existing PyTorch adapter
  # handles it unchanged. Verified end-to-end including a real
  # client/server roundtrip; postprocess's NMS decode was cross-checked
  # directly against Ultralytics' own high-level YOLO.predict() pipeline
  # on the same image. `dataset: Synthetic` here for a lightweight smoke
  # test with no image download -- see the COCO entry below for the real
  # dataset pairing.
  - name: inference_pytorch_yolov8_synthetic
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: YOLOv8
    application: Object Detection
    dataset: Synthetic
    transport: TCP
    device: jetson_orin_nano

  # Same YOLOv8/Object Detection combo against the real COCO 2017 val
  # split -- see datasets/coco.py's docstring for how it avoids COCO's
  # two impractically large bulk downloads (annotations JSON extracted
  # from the 252MB zip; images fetched lazily one at a time via each
  # image's own coco_url). Unlike this project's random-init
  # architectures, YOLOv8 uses real pretrained weights, so this one's
  # detections are genuinely meaningful -- verified end-to-end including
  # a real client/server roundtrip, true label present among actual
  # detections in both test images.
  - name: inference_pytorch_yolov8_coco
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: YOLOv8
    application: Object Detection
    dataset: COCO
    transport: TCP
    device: jetson_orin_nano

  # Second architecture sharing Object Detection with YOLOv8, a genuinely
  # different two-stage (Faster R-CNN) detector design -- a new
  # architecture entry, not a cv_framework dispatch under YOLOv8. Real
  # random-init GeneralizedRCNN (ResNet18 backbone) built directly via
  # detectron2.modeling.build_model, no model_zoo config/checkpoint
  # needed. Its own RPN+ROI heads+NMS already decode detections inside
  # the model, packed into a fixed (1, 100, 6) padded tensor for this
  # project's wire protocol -- see architectures/detectron2.py's
  # docstring. Needed a real C/C++ compiler to install (never published
  # to PyPI; source build compiles custom ops CPU-only here, no CUDA
  # toolkit needed) -- same prerequisite as speech_framework: ESPnet and
