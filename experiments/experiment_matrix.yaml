# Example batch-experiment matrix. Each entry is a config overlay on top of
# config.yaml's defaults. This file isn't executed automatically yet -- it
# documents the intended format for a future batch-sweep runner, and is a
# convenient place to keep known-good combos plus combos you're planning to
# promote from stub to real next.

experiments:
  - name: inference_pytorch_resnet18_cifar10_tcp
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP

  - name: inference_pytorch_resnet18_cifar10_tls
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TLS

  # HTTP transport: plain http.server/http.client, standard library only.
  # Verified end-to-end including a real client/server roundtrip -- see
  # transport/http.py's docstring for how its queue-based bridge adapts
  # this project's synchronous send()/recv() interface onto HTTP's
  # request/response model.
  - name: inference_pytorch_resnet18_synthetic_http
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: Synthetic
    transport: HTTP

  # Verified directly: load/predict/serialize/deserialize, plus confirmed
  # MobileNetV2 also runs correctly through the OpenVINO adapter
  # unchanged -- these unlock real use across every already-implemented
  # framework's generic PyTorch-conversion path, not just PyTorch.
  - name: inference_pytorch_mobilenetv2_cifar10
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: MobileNetV2
    application: Image Classification
    dataset: CIFAR10
    transport: TCP

  - name: inference_pytorch_resnet50_cifar10
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet50
    application: Image Classification
    dataset: CIFAR10
    transport: TCP

  # First Transformer-family architecture. Verified end-to-end through
  # PyTorch; deliberately not paired with OpenVINO here -- conversion
  # fails on ViT specifically (Dropout trace-consistency false positive),
  # see architectures/vit.py's docstring.
  - name: inference_pytorch_vit_cifar10
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: ViT
    application: Image Classification
    dataset: CIFAR10
    transport: TCP

  # First NLP vertical slice. input_ids/token_type_ids/attention_mask are
  # stacked into one (3, 32) tensor to fit this project's one-tensor wire
  # protocol -- see architectures/bert.py's docstring. IMDB is downloaded
  # via the standard library, not HuggingFace's `datasets` pip package
  # (name collision with this project's own datasets/ package -- see
  # datasets/imdb.py's docstring). Verified end-to-end including a real
  # client/server roundtrip.
  - name: inference_pytorch_bert_imdb
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: BERT
    application: Sentiment Analysis
    dataset: IMDB
    transport: TCP

  # Second dataset for the same Sentiment Analysis pipeline, no changes
  # needed to BERT or Sentiment Analysis. Real GLUE-benchmark SST-2
  # release, downloaded/parsed via the standard library -- see
  # datasets/sst2.py's docstring for how test.tsv (no labels) was ruled
  # out in favor of dev.tsv. Verified end-to-end including a real
  # client/server roundtrip.
  - name: inference_pytorch_bert_sst2
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: BERT
    application: Sentiment Analysis
    dataset: SST2
    transport: TCP

  # Reuses the BERT/Sentiment Analysis/IMDB pipeline unchanged.
  # DistilBERT's forward() takes only input_ids/attention_mask, no
  # token_type_ids -- see architectures/distilbert.py's docstring.
  - name: inference_pytorch_distilbert_imdb
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: DistilBERT
    application: Sentiment Analysis
    dataset: IMDB
    transport: TCP

  # New architecture beyond the original 13, same gap-fill precedent as
  # Autoencoder/YOLOv8-Seg. Whisper's real inference is autoregressive
  # generation, run inside _WhisperWrapper.forward() -- see
  # architectures/whisper.py's docstring. speech_framework: Whisper is
  # validated but doesn't change behavior (architectures/whisper.py's
  # default already IS the real implementation) -- see
  # speech_frameworks/whisper_adapter.py. Verified end-to-end including a
  # real client/server roundtrip.
  - name: inference_pytorch_whisper_synthetic
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: Whisper
    application: Speech Recognition
    dataset: Synthetic
    transport: TCP

  # Last application/architecture gap, and what llm_framework was added
  # for. Same autoregressive-generation-inside-forward() pattern as
  # Whisper -- see architectures/gpt2.py's docstring. Unlike Image
  # Generation/Speech Recognition, real IMDB text is a meaningful
  # generation prompt, so it's reused directly rather than synthesized.
  # llm_framework: HuggingFace Transformers is validated but doesn't
  # change behavior (architectures/gpt2.py's default already IS the real
  # implementation) -- see llm_frameworks/huggingface_transformers_adapter.py.
  # Verified end-to-end including a real client/server roundtrip with
  # real IMDB prompts.
  - name: inference_pytorch_gpt2_imdb
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: GPT-2
    application: Text Generation
    dataset: IMDB
    transport: TCP

  # Same GPT-2/Text Generation/IMDB combo, but llm_framework: FastChat
  # genuinely changes behavior here (unlike HuggingFace Transformers
  # above): architectures/gpt2.py dispatches to
  # llm_frameworks/fastchat_adapter.py's build_gpt2(), which loads the
  # model back through FastChat's own load_model() instead of keeping it
  # in-process. See that module's docstring for the conversation-template
  # dead end (its default template blows past this project's context
  # window; the "raw" template works but would need config threaded into
  # Application.preprocess()). Verified end-to-end including a real
  # client/server roundtrip with real IMDB prompts.
  - name: inference_pytorch_gpt2_imdb_fastchat
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: GPT-2
    application: Text Generation
    dataset: IMDB
    transport: TCP
    llm_framework: FastChat

  # First RNN-family vertical slice. UCI HAR's real archive is a nested
  # zip with 9 "Inertial Signals" channel files, 128-timestep windows --
  # confirmed by inspection, see datasets/uci_har.py's docstring.
  # families/rnn's shared transpose helper handles the (channels,
  # timesteps) -> (timesteps, channels) conversion both LSTM and GRU
  # reuse unchanged. Verified end-to-end for both including a real
  # client/server roundtrip (LSTM).
  - name: inference_pytorch_lstm_ucihar
    paradigm: inference
    framework: PyTorch
    family: RNN
    architecture: LSTM
    application: Activity Recognition
    dataset: UCI HAR
    transport: TCP

  - name: inference_pytorch_gru_ucihar
    paradigm: inference
    framework: PyTorch
    family: RNN
    architecture: GRU
    application: Activity Recognition
    dataset: UCI HAR
    transport: TCP

  # First Diffusion-family slice. "Inference" is a T=20-step reverse-
  # diffusion loop, but it lives entirely inside the model's forward() --
  # invisible to the framework adapter, one predict() call in/out over the
  # same wire protocol as everything else. See architectures/ddpm.py's
  # docstring. Verified no NaN/Inf across the full reverse process, plus a
  # real client/server roundtrip.
  - name: inference_pytorch_ddpm_synthetic
    paradigm: inference
    framework: PyTorch
    family: Diffusion
    architecture: DDPM
    application: Image Generation
    dataset: Synthetic
    transport: TCP

  - name: fl_flower_resnet18_cifar10
    paradigm: federated_learning
    fl_framework: Flower
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 2
    num_rounds: 3

  # Real torch.distributed gloo/TCP rendezvous verified working in
  # isolation on this machine; the client/server pair hangs indefinitely
  # right after connecting, inside FedLab's own post-connect handshake --
  # see frameworks/fedlab_adapter.py's docstring for exactly what was
  # isolated and what remains unresolved.
  - name: fl_fedlab_resnet18_cifar10
    paradigm: federated_learning
    fl_framework: FedLab
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 1
    num_rounds: 1

  # Two separate real problems, both confirmed directly, not just
  # untested: import nvflare fails outright on Windows (needs the
  # POSIX-only `resource` module), and separately, the simulator_run()
  # API this adapter uses runs every client in-process over in-memory
  # queues even on a supported OS -- no real network traffic at all. See
  # fl_frameworks/nvflare_adapter.py's docstring for both.
  - name: fl_nvflare_resnet18_cifar10
    paradigm: federated_learning
    fl_framework: NVFlare
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 2
    num_rounds: 1

  - name: distributed_ddp_resnet18_cifar10
    paradigm: distributed_training
    distributed_framework: DistributedDataParallel
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 2
    num_rounds: 2

  # OSS + ShardedDataParallel over the same gloo/TCP process group as the
  # DDP entry above. The FairScale-specific mechanics were verified
  # end-to-end via an isolated two-rank synthetic-data script (both ranks
  # completed real forward/backward/step cycles cleanly); the full
  # main.py path with real CIFAR10 wasn't run start-to-finish here purely
  # due to a slow download in this environment, not anything specific to
  # FairScale -- see distributed_frameworks/fairscale_adapter.py's docstring.
  - name: distributed_fairscale_resnet18_cifar10
    paradigm: distributed_training
    distributed_framework: FairScale
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    num_clients: 2
    num_rounds: 2

  # Implemented, but hardware-gated -- needs an actual NVIDIA GPU (Jetson)
  # with TensorRT + pycuda installed to run; validates and lists fine
  # without them, it just can't build/run an engine.
  - name: inference_tensorrt_resnet18_jetson
    paradigm: inference
    framework: TensorRT
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: jetson_agx_orin

  # Implemented and verified end-to-end -- OpenVINO's CPU plugin runs on
  # any x86/ARM machine, no special hardware required.
  - name: inference_openvino_resnet18_windows
    paradigm: inference
    framework: OpenVINO
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: windows

  # Implemented; conversion needs a Python version `tensorflow` has a wheel
  # for (via litert-torch), inference itself is TensorFlow-independent
  # (ai-edge-litert). Validates and lists fine regardless.
  - name: inference_tflite_resnet18_linux
    paradigm: inference
    framework: TensorFlow Lite
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: ubuntu

  # Implemented and verified end-to-end -- pure Python/C++ wheel, no
  # special hardware required.
  - name: inference_onnxruntime_resnet18_windows
    paradigm: inference
    framework: ONNX Runtime
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: windows

  # Implemented and verified end-to-end (model prep/conversion + desktop
  # inference); real on-device NNAPI/CoreML execution needs a native
  # Android/iOS app, out of scope -- device here is the intended target,
  # not where this process literally runs.
  - name: inference_onnxruntimemobile_resnet18_iphone
    paradigm: inference
    framework: ONNX Runtime Mobile
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: iphone

  # Implemented and verified end-to-end (trace -> optimize_for_mobile ->
  # save .ptl -> load -> run, all via `torch` -- no extra dependency);
  # real on-device execution needs a native Android/iOS app, out of scope
  # -- device here is the intended target, not where this process runs.
  - name: inference_pytorchmobile_resnet18_android
    paradigm: inference
    framework: PyTorch Mobile
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: samsung_galaxy

  # Written to ExecuTorch's documented export/host-runtime API but NOT
  # execution-verified -- `executorch` has no PyPI wheel for this
  # project's Python version. Validates and lists fine either way; see
  # frameworks/executorch_adapter.py's docstring before relying on it.
  - name: inference_executorch_resnet18_iphone
    paradigm: inference
    framework: ExecuTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: iphone

  # Written to TVM's documented Relay-frontend/graph_executor API but NOT
  # execution-verified -- `apache-tvm` has no prebuilt wheel here and
  # falls back to a from-source CMake build that needs a C/C++ compiler
  # toolchain this machine doesn't have. Validates and lists fine; see
  # frameworks/tvm_adapter.py's docstring before relying on it.
  - name: inference_tvm_resnet18_windows
    paradigm: inference
    framework: TVM
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: windows

  # Conversion verified end-to-end on Windows (coremltools.convert with
  # convert_to="neuralnetwork"); running the converted model was tried and
  # confirmed to fail with coremltools' own real "prediction only
  # supported on macOS" error -- structurally the same as TensorRT
  # needing an NVIDIA GPU. device here is the intended execution target.
  - name: inference_coreml_resnet18_macbook
    paradigm: inference
    framework: CoreML
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: macbook

  # PyTorch's own MPS execution backend, not a converter -- reuses
  # ResNet18 unconverted, just moved onto torch.device("mps"). Verified
  # directly on this Windows machine: torch.backends.mps.is_available()
  # correctly reports False (no Metal backend compiled into non-Apple
  # torch builds), and the adapter raises a clear error at build() time
  # rather than silently falling back to CPU.
  - name: inference_mpsbackend_resnet18_macbook
    paradigm: inference
    framework: MPS Backend
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: macbook

  # First non-ResNet18 vertical slice: YOLOv8 loaded via Ultralytics
  # itself, returned as a plain nn.Module so the existing PyTorch adapter
  # handles it unchanged. Verified end-to-end including a real
  # client/server roundtrip; postprocess's NMS decode was cross-checked
  # directly against Ultralytics' own high-level YOLO.predict() pipeline
  # on the same image. `dataset: Synthetic` here for a lightweight smoke
  # test with no image download -- see the COCO entry below for the real
  # dataset pairing.
  - name: inference_pytorch_yolov8_synthetic
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: YOLOv8
    application: Object Detection
    dataset: Synthetic
    transport: TCP
    device: jetson_orin_nano

  # Same YOLOv8/Object Detection combo against the real COCO 2017 val
  # split -- see datasets/coco.py's docstring for how it avoids COCO's
  # two impractically large bulk downloads (annotations JSON extracted
  # from the 252MB zip; images fetched lazily one at a time via each
  # image's own coco_url). Unlike this project's random-init
  # architectures, YOLOv8 uses real pretrained weights, so this one's
  # detections are genuinely meaningful -- verified end-to-end including
  # a real client/server roundtrip, true label present among actual
  # detections in both test images.
  - name: inference_pytorch_yolov8_coco
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: YOLOv8
    application: Object Detection
    dataset: COCO
    transport: TCP
    device: jetson_orin_nano

  # Last dataset stub. Streams the official 6.3GB val tar via tarfile's
  # streaming mode rather than downloading it, stopping once enough
  # images are collected -- confirmed directly this only transfers the
  # kept images' bytes. Real finding from testing: the tar's physical
  # entry order is class-grouped (50 images/class), so a literal
  # first-N read returned the same label 15/15 times; fixed by keeping
  # only every 97th qualifying entry, confirmed to produce 15/15 unique
  # labels -- see datasets/imagenet.py's docstring. Ground truth comes
  # from the small official devkit (meta.mat + ground_truth.txt),
  # downloaded and cached in full. Verified end-to-end including a real
  # client/server roundtrip.
  - name: inference_pytorch_resnet18_imagenet
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: ImageNet
    transport: TCP

  # YOLOv8-Seg is a new architecture beyond the original 13 -- Ultralytics'
  # segmentation checkpoint is a genuinely different head/output shape
  # from plain YOLOv8. Two structurally different output tensors
  # (detections + mask prototypes) are flattened/concatenated at a fixed
  # split point to fit this project's one-tensor wire protocol -- see
  # architectures/yolov8_seg.py's docstring. postprocess cross-checked
  # directly against Ultralytics' own YOLO.predict() on a real test image.
  # Verified end-to-end through the PyTorch adapter.
  - name: inference_pytorch_yolov8seg_synthetic
    paradigm: inference
    framework: PyTorch
    family: CNN
    architecture: YOLOv8-Seg
    application: Segmentation
    dataset: Synthetic
    transport: TCP
    device: jetson_orin_nano

  # Second Segmentation-application architecture, with a completely
  # different output format from YOLOv8-Seg above -- Segmentation's
  # postprocess dispatches between them by total element count (65,537 vs
  # 1,793,600). Random-init via sam_model_registry["vit_b"](checkpoint=None),
  # no checkpoint download. See architectures/sam.py's docstring for how
  # its three internal stages (image_encoder/prompt_encoder/mask_decoder)
  # are chained directly, and applications/segmentation.py's docstring for
  # the dispatch. Verified end-to-end through the PyTorch adapter,
  # including a real client/server roundtrip and a YOLOv8-Seg regression
  # check afterward.
  - name: inference_pytorch_sam_synthetic
    paradigm: inference
    framework: PyTorch
    family: Transformer
    architecture: SAM
    application: Segmentation
    dataset: Synthetic
    transport: TCP

  # Written to onnx2tf's documented conversion API but NOT
  # execution-verified -- `tensorflow` has no wheel for this project's
  # Python version at all. Validates and lists fine either way; see
  # frameworks/tensorflow_adapter.py's docstring before relying on it.
  - name: inference_tensorflow_resnet18_windows
    paradigm: inference
    framework: TensorFlow
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: windows

  # Written to TFLite Micro's documented host-runtime API but NOT
  # execution-verified -- there's no PyPI package at all for `tflite-micro`,
  # only a from-source Bazel build. Validates and lists fine; see
  # frameworks/tensorflow_lite_micro_adapter.py's docstring first.
  - name: inference_tensorflowlitemicro_resnet18_android
    paradigm: inference
    framework: TensorFlow Lite Micro
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: samsung_galaxy

  # Written to MediaPipe's documented Tasks + MetadataWriter API but NOT
  # execution-verified -- mediapipe itself installs cleanly, but its
  # model-prep step needs the same blocked TFLite conversion above.
  # Validates and lists fine; see frameworks/mediapipe_adapter.py first.
  - name: inference_mediapipe_resnet18_iphone
    paradigm: inference
    framework: MediaPipe
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: iphone

  # Written to pnnx/ncnn's documented conversion + inference API but
  # deliberately NOT run here -- pnnx.export() shells out to a bundled
  # compiled binary, left unexecuted by explicit decision. Validates and
  # lists fine; see frameworks/ncnn_adapter.py's docstring first.
  - name: inference_ncnn_resnet18_raspberrypi
    paradigm: inference
    framework: NCNN
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: raspberry_pi_5

  # Written to the Qualcomm Neural Processing SDK's documented CLI
  # workflow but NOT execution-verified -- not a pip package at all,
  # needs a manually downloaded SDK + Qualcomm developer account.
  # Validates and lists fine; see frameworks/snpe_adapter.py first.
  - name: inference_snpe_resnet18_googlepixel
    paradigm: inference
    framework: SNPE
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: google_pixel

  # Written to rknn-toolkit2's documented API (host-side CPU simulator
  # mode, no real Rockchip NPU needed for that specific path) but NOT
  # execution-verified -- no wheel for this platform/Python version.
  # Validates and lists fine; see frameworks/rknn_adapter.py first.
  - name: inference_rknn_resnet18_ubuntu
    paradigm: inference
    framework: RKNN
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: ubuntu

  # Written to pyarmnn's documented API but NOT execution-verified --
  # not a normal PyPI package on x86_64 Windows, targets Arm platforms.
  # Validates and lists fine; see frameworks/arm_nn_adapter.py first.
  - name: inference_armnn_resnet18_jetsonxavier
    paradigm: inference
    framework: Arm NN
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: jetson_xavier

  # Written to the documented GStreamer + pyds pipeline shape but NOT
  # execution-verified, and the most speculative adapter in this project
  # given DeepStream's stream-oriented architecture. Validates and lists
  # fine; see frameworks/deepstream_adapter.py's docstring first.
  - name: inference_deepstream_resnet18_jetsonagxorin
    paradigm: inference
    framework: DeepStream
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: jetson_agx_orin

  # Architecturally different from every other entry above: Edge Impulse
  # has no local conversion path for an arbitrary PyTorch architecture,
  # models come from Edge Impulse Studio (cloud, account required).
  # load_model raises a clear error for ResNet18 specifically since this
  # project has no Edge Impulse export for it. See
  # frameworks/edge_impulse_adapter.py's docstring first.
  - name: inference_edgeimpulse_resnet18_jetsonorinnano
    paradigm: inference
    framework: Edge Impulse
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: jetson_orin_nano

  # Blocked by a trust concern, not a dependency/hardware gap: this
  # project's mnnconvert --help test triggered an undisclosed pip install
  # of unrelated network dependencies instead of printing usage. mnn has
  # been uninstalled here as a precaution; the conversion subprocess call
  # is written but deliberately unexercised. See
  # frameworks/mnn_adapter.py's docstring before running it yourself.
  - name: inference_mnn_resnet18_raspberrypi
    paradigm: inference
    framework: MNN
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: raspberry_pi_5

  # NNAPI has no standalone Python binding -- real path is ONNX Runtime's
  # own NNAPIExecutionProvider, compiled into onnxruntime-android/ORT
  # Mobile, not the plain onnxruntime wheel this project depends on.
  # Verified directly: get_available_providers() correctly excludes it
  # here, and load_model() raises a clear error rather than letting ORT
  # silently fall back to CPUExecutionProvider under an "NNAPI" label.
  - name: inference_nnapi_resnet18_android
    paradigm: inference
    framework: NNAPI
    family: CNN
    architecture: ResNet18
    application: Image Classification
    dataset: CIFAR10
    transport: TCP
    device: samsung_galaxy

  # Completes the family axis (6/6). Both architecture and application are
  # new additions, not existing stubs -- the original taxonomy paired only
  # 5 of its 6 families with an architecture, and none of the 8 original
  # applications fit an autoencoder's actual task. Small conv encoder/
  # decoder, Sigmoid output kept in [0,1] via families/autoencoder's own
  # scaling helper (not families/cnn's ImageNet normalization). Verified
  # end-to-end with real CIFAR10 images, plus a real client/server
  # roundtrip with correct ground truth.
  - name: inference_pytorch_autoencoder_cifar10
    paradigm: inference
    framework: PyTorch
    family: Autoencoder
    architecture: Autoencoder
    application: Image Reconstruction
    dataset: CIFAR10
    transport: TCP
